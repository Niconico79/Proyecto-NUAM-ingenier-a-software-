<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUAM - Iniciar sesión</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1e1e2f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            width: 350px;
            background: #2a2a3f;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #00ff88;
            text-align: center;
        }

        p {
            color: #aaaaaa;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1e1e2f;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #00ff88;
            color: #121212;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff6b81;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-box">

        <h1>NUAM Exchange</h1>
        <p>Mantenedor de Calificaciones Tributarias</p>

        {% if form.errors %}
            <div class="error">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="id_username">Usuario</label>
            <input
                type="text"
                name="username"
                id="id_username"
                required
                autofocus
            >

            <label for="id_password">Contraseña</label>
            <input
                type="password"
                name="password"
                id="id_password"
                required
            >

            <button type="submit">Iniciar sesión</button>
        </form>

    </div>
</body>
</html>
